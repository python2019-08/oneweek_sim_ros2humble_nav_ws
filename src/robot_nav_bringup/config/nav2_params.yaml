bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    # 必须显式指定：ControllerServer 声明 odom_topic 的默认值是 "odom"，
    # 而本工程里 /odom 没有任何发布者（只有 controller_server 自己订阅），
    # 于是 nav2_util::OdomSmoother 永远收不到消息、报出的底盘速度恒为 0。
    # DWB 因此一直以为机器人静止：轨迹可达性/加速度判断和 RotateToGoal 的
    # 停转判定全部建立在"当前速度 = 0"这个假前提上。bt_navigator 早就
    # 指向 /odometry/filtered，这里保持一致。
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    # SimpleProgressChecker 只比较平移：它内部的 pose_distance() 里根本没有
    # 角度项，只要 10s 内位移不足 required_movement_radius 就判"没进展"。
    # 而本车 max_vel_theta=0.35 rad/s、acc_lim_theta=0.50，原地掉头 180° 需要
    # 0.7s 加速 + 8.6s 巡航 ≈ 9.3s：一旦需要转超过约 190°，就顶穿
    # movement_time_allowance=10s，controller_server 立刻报
    # "Failed to make progress" -> abort -> 恢复 -> 重发目标，形成 abort 循环。
    # 这是与定位无关的第二个独立成因。
    # PoseProgressChecker 继承 SimpleProgressChecker，额外比较姿态角
    # （required_movement_angle），nav2 官方就是用它把"原地旋转"也算作有进展。
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.10
      required_movement_angle: 0.25
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.50
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.15
      max_vel_y: 0.0
      max_vel_theta: 0.35
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 0.25
      acc_lim_y: 0.0
      acc_lim_theta: 0.50
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      # width/height must be INTEGERS in Humble: Costmap2DROS declares them with
      # an integer default, and a double literal (4.0) makes the constructor throw
      # "parameter 'height' has invalid type" -> the component never loads.
      width: 4
      height: 4
      resolution: 0.05
      # 用显式 footprint 取代 robot_radius: 0.30 —— 那个值把车写大了一整圈。
      # 真实外廓：底盘 box 0.5(x)×0.4(y)；前轮 y=±0.20 半径 0.05 → ±0.225；
      # 后脚轮球 y=±0.20 半径 0.05 → ±0.25。xy 外接框实为 0.5×0.5 的正方形，
      # 内切半径 0.25 m。Nav2 会据此自己算 inscribed=0.25 / circumscribed=0.354。
      footprint: "[[-0.25, -0.25], [-0.25, 0.25], [0.25, 0.25], [0.25, -0.25]]"
      plugins: ["voxel_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0          
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 253(INSCRIBED) 硬墙的厚度 = min(inscribed_radius, inflation_radius)。
        # NavFn 在 setCostmap 里把 253 和 254 一视同仁当障碍（>=COST_OBS_ROS
        # 的值都留成 COST_OBS），起点一旦落在 253 上，calcNavFnDijkstra 直接
        # 返回 false —— 这就是复测里 42 次 "failed to generate a valid path"。
        # 旧配置 inflation 0.05/0.12 < inscribed 0.30，膨胀循环跑不到 inscribed
        # 就停了，代价图里没有 1..252 的梯度，DWB 才一路贴墙；提到 0.35 后梯度
        # 回来了，但 253 硬墙同步涨到 0.30 m，比车的真实半宽 0.25 m 还宽 5 cm，
        # 车一贴墙整格陷进 253，规划器再也起不来 —— 规划级死锁。
        # 现在 inscribed 由 footprint 定成真实的 0.25，inflation 给到 0.60：
        # 253 硬墙恰好等于车的物理半宽，而 0.25→0.60 留出 0.35 m 宽的梯度。
        cost_scaling_factor: 3.0
        inflation_radius: 0.60
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # 同 local_costmap：显式 footprint（真实外接框 0.5×0.5），内切半径 0.25 m
      footprint: "[[-0.25, -0.25], [-0.25, 0.25], [0.25, 0.25], [0.25, -0.25]]"
      resolution: 0.05
      track_unknown_space: true
      # 去掉 obstacle_layer：它把实时 /scan 变换到 map 帧后画进来，一旦 AMCL 的
      # map->odom 偏了（空方房间定位退化，实测偏约 66°），房间自己的墙角就会被
      # 画到屋里，形成黄色框里那种"不该有的直角假墙"。全局图只信静态地图+膨胀。
      # obstacle_layer 的参数块保留在下面，需要动态障碍时再放回插件列表。
      plugins: ["static_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        observation_persistence: 0.3
        scan:
          topic: /scan
          data_type: "LaserScan"
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          clearing: True
          marking: True          
          raytrace_max_range: 3.5
          raytrace_min_range: 0.3
          obstacle_max_range: 3.5
          obstacle_min_range: 0.3
          min_range: 0.3
          max_range: 3.5          
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 同 local_costmap：253 硬墙厚度 = min(inscribed, inflation)。旧版
        # inflation 0.05/0.12 < inscribed 0.30 时膨胀环提前停住，全局图里只有
        # 0/99/100 三种值、99 环仅 3 格，NavFn 以为柱子只比实际大 0.15 m，路径
        # 贴柱面走；提到 0.35 后 253 硬墙变成 0.30 m，反而超过车的真实半宽
        # 0.25 m，车一贴墙就站死在 253 格上。现按 footprint 得到 inscribed 0.25，
        # inflation 0.60：硬墙 = 车的物理半宽，梯度带宽 0.35 m。
        cost_scaling_factor: 3.0
        inflation_radius: 0.60
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    # 同 controller_server：/odom 无人发布，保持 "odom" 等于永远拿不到
    # 实际速度。当前 feedback 是 OPEN_LOOP 所以还没暴露出差别，但一旦
    # 改成 CLOSED_LOOP 就会立刻失效，这里一并修正。
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
