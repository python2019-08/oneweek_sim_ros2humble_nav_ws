amcl:
  ros__parameters:
    use_sim_time: True
    # 不给初始位姿，AMCL 会拒绝发布 map->odom（只刷 "AMCL cannot publish a pose
    # or update the transform. Please set the initial pose..."），
    # 于是 RViz Fixed Frame=map 时 RobotModel 全是 error，global_costmap 也起不来。
    # 机器人由 spawn_entity.py 无参 spawn 在 Gazebo 世界原点，而 demo_map 的
    # origin=[-2.46,-2.47] + 99x99@0.05 正好是围绕原点的 ±2.47m，所以这里用 0 0 0。
    set_initial_pose: True
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    # 里程计噪声系数：原来的 0.2 太大，粒子扩散过快，AMCL 容易稳定收敛到
    # 错误的朝向（实测 map->odom 与 Gazebo 真值相差约 66°），
    # 于是 global_costmap 把房间自身的墙角按错位姿画进屋里 = "室内直角假墙"。
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # 与 URDF 里传感器 <range> 保持一致：原来 max=100 远超传感器实际 8m，
    # min=-1 等于"距离多近都当真实观测"，实测 /scan 里 0.26~0.55m 的车身
    # 回波会被整条吃进似然场，把粒子群往错误方向拉。
    laser_max_range: 8.0
    laser_min_range: 0.55
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    # likelihood_field 模型：pz = z_hit*exp(-d²/2σ²) + z_rand*(1/max_range)。
    # 原来 0.5/0.5 意味着一半权重给了随机噪声，偏 66° 的错误位姿也能拿高分。
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: scan

